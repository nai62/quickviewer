name: C++ lint

on:
  pull_request:
    paths:
      - "QuickViewer/**/*.c"
      - "QuickViewer/**/*.cc"
      - "QuickViewer/**/*.cpp"
      - "QuickViewer/**/*.cxx"
      - "QuickViewer/**/*.h"
      - "QuickViewer/**/*.hh"
      - "QuickViewer/**/*.hpp"
      - "qvtest/**/*.c"
      - "qvtest/**/*.cc"
      - "qvtest/**/*.cpp"
      - "qvtest/**/*.cxx"
      - "qvtest/**/*.h"
      - "qvtest/**/*.hh"
      - "qvtest/**/*.hpp"
      - ".clang-format"
      - ".clang-format-ignore"
      - "scripts/lint-cpp.py"

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check all C++ files
        run: >-
          python3 scripts/lint-cpp.py
          --all
          --clang-format clang-format-18
