name: C++ lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check all C++ files
        run: >-
          python3 scripts/lint-cpp.py
          --all
          --clang-format clang-format-18
