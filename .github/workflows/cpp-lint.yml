name: C++ lint

on:
  pull_request:
    paths:
      - "apps/quickviewer/**"
      - "components/i18n/**"
      - "tests/fileloader/**"
      - "tests/prefetchplanner/**"
      - "tests/latestresultdispatcher/**"
      - "tests/asynccache/**"
      - "tests/svgloader/**"
      - "tests/viewernavigation/**"
      - "tests/windowstartup/**"
      - ".clang-format"
      - ".clang-format-ignore"
      - ".gitattributes"
      - "scripts/lint-cpp.py"

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check all C++ files
        run: >-
          python3 scripts/lint-cpp.py
          --all
          --clang-format clang-format-18
