name: Build (Windows)

on:
  pull_request:

permissions:
  contents: read

env:
  QT_VERSION: "6.10.3"
  QT_ARCH: "win64_msvc2022_64"

jobs:
  build:
    name: Windows x64 (MSVC 2022)
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ env.QT_ARCH }}
          modules: "qtimageformats"
          archives: "qtbase qtsvg qttools"
          dir: 'C:\Qt'
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.87.0 --profile minimal
          rustup default 1.87.0
          rustc --version

      - name: Install jom
        shell: pwsh
        run: choco install jom -y --no-progress

      - name: Configure release build
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake -r ..\QVproject.pro CONFIG+=release CONFIG-=debug CONFIG-=debug_and_release CONFIG-=debug_and_release_target

      - name: Build
        shell: cmd
        working-directory: build
        run: jom /f Makefile

      # Guard against accidentally linking the file-association entry point into
      # QuickViewer.exe. The real application imports CreateNamedPipeW.
      - name: Verify QuickViewer.exe entry point
        shell: cmd
        working-directory: build
        run: dumpbin /nologo /imports bin\QuickViewer.exe | findstr /C:"CreateNamedPipeW"
